<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XC Weather App</title>

  <link rel="stylesheet" href="style.css" />
  <script src="scripts.js" defer></script>
</head>

<body>
  <main class="app">

    <!-- HEADER -->
    <header class="topBar">
      <div>
        <p class="label">Location</p>
        <h1 id="locationName">Loading...</h1>
        <p id="lastUpdated">--</p>
      </div>

      <div class="topRight">
        <button id="openModal">Change Location</button>
        <button id="unitToggle">°C / °F</button>
      </div>
    </header>

    <!-- CURRENT -->
    <section class="card">
      <h2>Now</h2>
      <h1 id="mainTemp">--</h1>
      <p id="otherTemp">--</p>

      <div id="conditionIcon"></div>
      <p id="conditionText"></p>

      <p>Humidity: <span id="humidityValue"></span>%</p>
      <p>Wind: <span id="windSpeed"></span> kph (<span id="windDir"></span>)</p>
    </section>

    <!-- 3 DAY -->
    <section class="card">
      <h2>3-Day Forecast</h2>

      <div class="futureGrid">
        <div>
          <p id="day1Name"></p>
          <div id="day1Icon"></div>
          <p id="day1Condition"></p>
          <p><span id="day1Hi"></span> / <span id="day1Lo"></span></p>
          <p id="day1Wind"></p>
        </div>

        <div>
          <p id="day2Name"></p>
          <div id="day2Icon"></div>
          <p id="day2Condition"></p>
          <p><span id="day2Hi"></span> / <span id="day2Lo"></span></p>
          <p id="day2Wind"></p>
        </div>

        <div>
          <p id="day3Name"></p>
          <div id="day3Icon"></div>
          <p id="day3Condition"></p>
          <p><span id="day3Hi"></span> / <span id="day3Lo"></span></p>
          <p id="day3Wind"></p>
        </div>
      </div>
    </section>

    <!-- HOURLY -->
    <section class="card">
      <h2>Hourly Forecast</h2>
      <div id="hourlyContainer" class="hourlyGrid"></div>
    </section>

  </main>

  <!-- MODAL -->
  <div id="modalOverlay" class="hidden"></div>

  <div id="locationModal" class="hidden">
    <form id="locationForm">
      <input id="locationInput" placeholder="Enter city" required>

      <select id="savedLocations"></select>
      <button type="button" id="useSaved">Use Selected</button>
      <button type="button" id="resetLocation">Use My Location</button>

      <button type="submit">Search</button>
      <button type="button" id="closeModal">Cancel</button>
    </form>
  </div>

</body>

</html>
