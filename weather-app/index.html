<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App 2.0</title>

  <link rel="stylesheet" href="style.css" />
  <script src="scripts.js" defer></script>
</head>

<body>
  <main class="app">

    <!-- LOCATION HEADER -->
    <header class="topBar">
      <div>
        <p class="label">Location</p>
        <h1 class="location" id="locationName">Loading...</h1>
        <p class="updated" id="lastUpdated">--</p>
      </div>

      <div class="topRight">
        <button id="openModal">Change Location</button>
        <div class="unitBadge">°C / °F</div>
      </div>
    </header>

    <!-- CURRENT CONDITIONS -->
    <section class="card" id="currentInfo">

      <div class="currentLeft">
        <p class="label">Now</p>

        <div id="currentTemp">
          <div class="tempBig">
            <span class="tempNum" id="tempC">--</span>
            <span class="tempUnit">°C</span>
          </div>
          <div class="tempSmall" id="tempF">--</div>
        </div>

        <div id="currentStatus">
          <div class="statusIcon" id="conditionIcon">☁️</div>
          <div>
            <p class="statusLabel">Condition</p>
            <p class="statusValue" id="conditionText">--</p>
          </div>
        </div>
      </div>

      <div class="currentRight">

        <!-- HUMIDITY -->
        <div class="miniCard" id="currentHumidity">
          <p class="miniTitle">Humidity</p>
          <p class="miniValue">
            <span class="bigNum" id="humidityValue">--</span>%
          </p>

          <div class="barWrap">
            <div class="bar" id="humidityBar" style="width: 0%"></div>
          </div>
        </div>

        <!-- WIND -->
        <div class="miniCard" id="currentWind">
          <p class="miniTitle">Wind</p>
          <p class="miniValue">
            <span class="bigNum" id="windSpeed">--</span> kph
            <span class="pill" id="windDir">--</span>
          </p>
        </div>

      </div>
    </section>

    <!-- NEXT 3 DAYS FORECAST -->
    <section class="card" id="futureInfo">

      <div class="sectionHead">
        <h2 class="sectionTitle">Next 3 Days</h2>
        <p class="sectionSub">Temp Range • Condition • Wind</p>
      </div>

      <div class="futureGrid">

        <!-- DAY 1 -->
        <div class="futureDay">
          <p class="dayName" id="day1Name">--</p>
          <div class="forecastIcon" id="day1Icon">☀️</div>
          <p class="forecastCondition" id="day1Condition">--</p>
          <p class="forecastTemp">
            <span class="hi" id="day1HiC">--</span> /
            <span class="lo" id="day1LoC">--</span>
          </p>
          <p class="futureWind" id="day1Wind">--</p>
        </div>

        <!-- DAY 2 -->
        <div class="futureDay">
          <p class="dayName" id="day2Name">--</p>
          <div class="forecastIcon" id="day2Icon">☀️</div>
          <p class="forecastCondition" id="day2Condition">--</p>
          <p class="forecastTemp">
            <span class="hi" id="day2HiC">--</span> /
            <span class="lo" id="day2LoC">--</span>
          </p>
          <p class="futureWind" id="day2Wind">--</p>
        </div>

        <!-- DAY 3 -->
        <div class="futureDay">
          <p class="dayName" id="day3Name">--</p>
          <div class="forecastIcon" id="day3Icon">☀️</div>
          <p class="forecastCondition" id="day3Condition">--</p>
          <p class="forecastTemp">
            <span class="hi" id="day3HiC">--</span> /
            <span class="lo" id="day3LoC">--</span>
          </p>
          <p class="futureWind" id="day3Wind">--</p>
        </div>

      </div>
    </section>

  </main>

  <!-- MODAL OVERLAY -->
  <div id="modalOverlay" class="hidden"></div>

  <!-- LOCATION MODAL -->
  <div id="locationModal" class="hidden">
    <div class="modalBox">
      <h2>Search Location</h2>

      <form id="locationForm">
        <label for="locationInput">Enter city or town</label>
        <input
          type="text"
          id="locationInput"
          name="locationInput"
          placeholder="Example: Seattle"
          required
        />

        <div class="modalButtons">
          <button type="submit">Search</button>
          <button type="button" id="closeModal">Cancel</button>
        </div>
      </form>
    </div>
  </div>
</body>

</html>
