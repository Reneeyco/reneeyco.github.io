<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App 2.0</title>

  <link rel="stylesheet" href="style.css" />
  <script src="scripts.js" defer></script>
</head>

<body>
  <main class="app">

    <header class="topBar">
      <div>
        <p class="label">Location</p>
        <h1 class="location" id="locationName">Loading...</h1>
        <p class="updated" id="lastUpdated">--</p>
      </div>

      <div class="topRight">
        <button id="openModal">Change Location</button>
        <div class="unitBadge">°C / °F</div>
      </div>
    </header>

    <section class="card" id="currentInfo">

      <div class="currentLeft">
        <p class="label">Now</p>

        <div id="currentTemp">
          <div class="tempBig">
            <span class="tempNum" id="tempC">--</span>
            <span class="tempUnit">°C</span>
          </div>
          <div class="tempSmall" id="tempF">--</div>
        </div>

        <div id="currentStatus">
          <div class="statusIcon" id="conditionIcon">☁️</div>
          <div>
            <p class="statusLabel">Condition</p>
            <p class="statusValue" id="conditionText">--</p>
          </div>
        </div>
      </div>

      <div class="currentRight">
        <div class="miniCard">
          <p class="miniTitle">Humidity</p>
          <p class="miniValue">
            <span class="bigNum" id="humidityValue">--</span>%
          </p>
          <div class="barWrap">
            <div class="bar" id="humidityBar"></div>
          </div>
        </div>

        <div class="miniCard">
          <p class="miniTitle">Wind</p>
          <p class="miniValue">
            <span class="bigNum" id="windSpeed">--</span> kph
            <span class="pill" id="windDir">--</span>
          </p>
        </div>
      </div>
    </section>

    <section class="card" id="futureInfo">
      <div class="sectionHead">
        <h2 class="sectionTitle">Next 3 Days</h2>
      </div>

      <div class="futureGrid">
        <div class="futureDay">
          <p id="day1Name">--</p>
          <div id="day1Icon">☀️</div>
          <p id="day1Condition">--</p>
          <p><span id="day1HiC">--</span> / <span id="day1LoC">--</span></p>
          <p id="day1Wind">--</p>
        </div>

        <div class="futureDay">
          <p id="day2Name">--</p>
          <div id="day2Icon">☀️</div>
          <p id="day2Condition">--</p>
          <p><span id="day2HiC">--</span> / <span id="day2LoC">--</span></p>
          <p id="day2Wind">--</p>
        </div>

        <div class="futureDay">
          <p id="day3Name">--</p>
          <div id="day3Icon">☀️</div>
          <p id="day3Condition">--</p>
          <p><span id="day3HiC">--</span> / <span id="day3LoC">--</span></p>
          <p id="day3Wind">--</p>
        </div>
      </div>
    </section>

  </main>

  <div id="modalOverlay" class="hidden"></div>

  <div id="locationModal" class="hidden">
    <div class="modalBox">
      <h2>Search Location</h2>

      <form id="locationForm">
        <input type="text" id="locationInput" placeholder="Seattle" required>

        <button type="submit">Search</button>
        <button type="button" id="closeModal">Cancel</button>
      </form>
    </div>
  </div>
</body>

</html>
