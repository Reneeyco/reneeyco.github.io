<!DOCTYPE html>
<html>
<head>
	
	<!-- meta tags and title -->
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tiny Project 10: Click-Tac-Toe</title>

	<!-- external CSS -->
	<link rel="stylesheet" href="style.css" media="all">
	
</head>
<body>

    <!-- game info -->
    <section id="gameInfo">
        <div id="turnBox">TURN: PLAYER X</div>
        <div id="messageBox">Click a square to start!</div>
    </section>

    <!-- tic-tac-toe board -->
    <div id="gameBoard">
        <div class="gameSpace" id="space0"></div>
        <div class="gameSpace" id="space1"></div>
        <div class="gameSpace" id="space2"></div>
        <div class="gameSpace" id="space3"></div>
        <div class="gameSpace" id="space4"></div>
        <div class="gameSpace" id="space5"></div>
        <div class="gameSpace" id="space6"></div>
        <div class="gameSpace" id="space7"></div>
        <div class="gameSpace" id="space8"></div>
    </div>

    <!-- reset button -->
    <button id="resetButton">PLAY AGAIN</button>

    <!-- javascript -->
    <script src="scripts.js"></script>

</body>
</html>
